<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>رفيقك الصحي - النظام الغذائي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/feather-icons/dist/feather.min.js"></script>
    <script src="https://unpkg.com/feather-icons"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&display=swap');
        :root {
            color-scheme: dark;
            --bg-base: #020617;
            --bg-deep: #0b1220;
            --accent-1: #38bdf8;
            --accent-2: #c084fc;
            --accent-3: #f472b6;
            --accent-4: #5eead4;
            --glass: rgba(15, 23, 42, 0.62);
            --glass-border: rgba(148, 163, 184, 0.28);
            --glass-highlight: rgba(255, 255, 255, 0.08);
            --text-primary: #e0f2fe;
            --text-secondary: rgba(224, 242, 254, 0.94);
            --text-muted: rgba(186, 230, 253, 0.78);
            --transition-curve: cubic-bezier(0.22, 1, 0.36, 1);
        }
        *, *::before, *::after {
            box-sizing: border-box;
        }
        ::selection {
            background: rgba(124, 58, 237, 0.4);
            color: var(--text-primary);
        }
        body {
            font-family: 'Tajawal', sans-serif;
            margin: 0;
            min-height: 100vh;
            background: var(--bg-base);
            color: var(--text-primary);
            overflow-x: hidden;
            position: relative;
        }
        body::before {
            content: "";
            position: fixed;
            inset: -15%;
            background:
                radial-gradient(circle at 22% 18%, rgba(56, 189, 248, 0.28), transparent 58%),
                radial-gradient(circle at 76% 12%, rgba(192, 132, 252, 0.36), transparent 60%),
                radial-gradient(circle at 48% 86%, rgba(244, 114, 182, 0.24), transparent 60%);
            opacity: 0.82;
            filter: saturate(135%);
            z-index: -6;
            animation: backgroundPulse 38s ease-in-out infinite alternate;
        }
        body::after {
            content: "";
            position: fixed;
            inset: -40%;
            background: conic-gradient(from 120deg, rgba(99, 102, 241, 0.18), transparent 40%, rgba(56, 189, 248, 0.22), transparent 78%);
            opacity: 0.6;
            filter: blur(130px);
            z-index: -7;
            animation: auroraDrift 48s linear infinite;
        }
        .gradient-bg {
            position: relative;
            min-height: 100vh;
            z-index: 0;
        }
        .gradient-bg::before,
        .gradient-bg::after {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: -5;
        }
        .gradient-bg::before {
            background: linear-gradient(120deg, rgba(15, 23, 42, 0.92), rgba(30, 58, 138, 0.62), rgba(124, 58, 237, 0.5), rgba(45, 212, 191, 0.3));
            mix-blend-mode: screen;
            opacity: 0.9;
        }
        .gradient-bg::after {
            background: url("{{ url_for('health_background') }}") center/cover no-repeat;
            opacity: 0.3;
            filter: brightness(0.5) saturate(1.35) contrast(1.16);
            transform: scale(1.2);
            animation: heroParallax 52s cubic-bezier(0.22, 1, 0.36, 1) infinite alternate;
        }
        .ambient-lights {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: -4;
            overflow: hidden;
        }
        .ambient-lights span {
            position: absolute;
            width: clamp(200px, 30vw, 360px);
            height: clamp(200px, 30vw, 360px);
            border-radius: 9999px;
            opacity: 0.45;
            filter: blur(90px);
            animation: floatOrbit 30s ease-in-out infinite;
        }
        .ambient-lights .ambient--one {
            top: -8%;
            right: -10%;
            background: radial-gradient(circle, rgba(99, 102, 241, 0.6), transparent 65%);
            animation-delay: -6s;
        }
        .ambient-lights .ambient--two {
            bottom: -12%;
            left: -8%;
            background: radial-gradient(circle, rgba(56, 189, 248, 0.52), transparent 70%);
            animation-delay: -12s;
        }
        .ambient-lights .ambient--three {
            top: 32%;
            left: 40%;
            background: radial-gradient(circle, rgba(244, 114, 182, 0.4), transparent 70%);
            animation-delay: -20s;
        }
        header {
            padding: 2.5rem 1.5rem 1.5rem;
        }
        .nav-shell {
            background: rgba(15, 23, 42, 0.66);
            border: 1px solid var(--glass-border);
            border-radius: 1.85rem;
            padding: 1rem 1.6rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            box-shadow: 0 28px 60px rgba(8, 47, 73, 0.45);
            backdrop-filter: blur(26px);
        }
        .nav-group {
            display: flex;
            align-items: center;
            gap: 1rem;
        }
        .nav-icon {
            width: 44px;
            height: 44px;
            border-radius: 1.3rem;
            display: grid;
            place-items: center;
            background: rgba(56, 189, 248, 0.24);
            color: var(--text-primary);
            border: 1px solid rgba(56, 189, 248, 0.35);
            transition: transform 0.4s var(--transition-curve), background 0.4s var(--transition-curve);
        }
        .nav-icon:hover {
            transform: translateX(4px);
            background: rgba(56, 189, 248, 0.32);
        }
        .nav-title {
            margin: 0;
            font-size: 1.35rem;
            font-weight: 700;
            color: var(--text-primary);
        }
        main {
            padding: 2.5rem 1.5rem 4rem;
        }
        .glass-panel {
            position: relative;
            background: var(--glass);
            border: 1px solid var(--glass-border);
            border-radius: 2rem;
            padding: 2.5rem;
            backdrop-filter: blur(28px);
            box-shadow: 0 40px 80px rgba(8, 47, 73, 0.45);
            overflow: hidden;
        }
        .glass-panel::before {
            content: "";
            position: absolute;
            inset: 1.5px;
            border-radius: inherit;
            border: 1px solid var(--glass-highlight);
            opacity: 0.8;
            pointer-events: none;
        }
        .glass-panel::after {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, transparent 35%, rgba(148, 163, 184, 0.22));
            opacity: 0;
            transition: opacity 0.55s var(--transition-curve);
            pointer-events: none;
        }
        .glass-panel:hover::after {
            opacity: 1;
        }
        .glass-content {
            position: relative;
            z-index: 2;
        }
        .section-title {
            font-size: clamp(1.8rem, 2.4vw, 2.1rem);
            font-weight: 700;
            color: var(--text-primary);
            margin-top: 0;
            margin-bottom: 2rem;
        }
        .field-label {
            display: block;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 0.75rem;
            
        }
        .input-control {
            width: 100%;
            padding: 0.95rem 1.1rem;
            border-radius: 1rem;
            border: 1px solid rgba(148, 163, 184, 0.28);
            background: linear-gradient(135deg, rgba(15, 23, 42, 0.8), rgba(15, 23, 42, 0.55));
            color: var(--text-primary);
            font-size: 0.95rem;
            transition: border-color 0.45s var(--transition-curve), box-shadow 0.45s var(--transition-curve), transform 0.45s var(--transition-curve);
        }
        .input-control::placeholder {
            color: var(--text-muted);
        }
        .input-control:focus {
            outline: none;
            border-color: rgba(56, 189, 248, 0.85);
            box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.25), 0 22px 55px rgba(8, 47, 73, 0.45);
            transform: translateY(-2px);
        }
        .select-control {
            appearance: none;
            background: linear-gradient(135deg, rgba(15, 23, 42, 0.92), rgba(15, 23, 42, 0.68));
            font-weight: 600;
            letter-spacing: 0.01em;
            cursor: pointer;
        }
        .select-control option {
            background: #0b1220;
            color: var(--text-primary);
        }
        .select-control option:checked {
            background: rgba(56, 189, 248, 0.22);
        }
        .action-button {
            position: relative;
            width: 100%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.65rem;
            border-radius: 1.1rem;
            border: none;
            padding: 1.05rem 1.4rem;
            font-weight: 700;
            letter-spacing: 0.02em;
            background: linear-gradient(120deg, rgba(48, 56, 133, 0.95), rgba(168, 85, 247, 0.95), rgba(244, 114, 182, 0.95));
            color: #1e293b;
            box-shadow: 0 32px 65px rgba(56, 189, 248, 0.35);
            transition: transform 0.55s var(--transition-curve), box-shadow 0.55s var(--transition-curve);
        }
        .action-button::after {
            content: "";
            position: absolute;
            inset: 2px;
            border-radius: inherit;
            background: linear-gradient(120deg, rgba(255, 255, 255, 0.6), rgba(255, 255, 255, 0.18));
            opacity: 0;
            transition: opacity 0.55s var(--transition-curve);
        }
        .action-button:hover {
            transform: translateY(-4px);
            box-shadow: 0 35px 70px rgba(56, 189, 248, 0.42);
        }
        .action-button:hover::after {
            opacity: 1;
        }
        .action-button:active {
            transform: translateY(-1px) scale(0.99);
        }
        .muted-text {
            color: var(--text-secondary);
            margin: 0;
        }
        .plan-card {
            margin-top: 2.5rem;
            border-radius: 1.9rem;
            border: 1px solid rgba(148, 163, 184, 0.32);
            background: rgba(15, 23, 42, 0.7);
            padding: 2rem;
            box-shadow: 0 28px 60px rgba(8, 47, 73, 0.45);
        }
        .plan-card h3 {
            margin: 0 0 1.5rem;
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--text-primary);
        }
        .plan-body {
            border-radius: 1.5rem;
            border: 1px solid rgba(56, 189, 248, 0.32);
            background: rgba(15, 23, 42, 0.6);
            padding: 1.6rem;
            box-shadow: inset 0 0 0 1px rgba(56, 189, 248, 0.18);
        }
        .plan-text {
            color: var(--text-secondary);
            white-space: pre-line;
            line-height: 1.7;
        }
        #pointer-glow {
            position: fixed;
            width: 220px;
            height: 220px;
            pointer-events: none;
            margin: 0;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.32) 0%, rgba(56, 189, 248, 0.22) 40%, rgba(167, 139, 250, 0.14) 70%, transparent 100%);
            filter: blur(14px);
            opacity: 0;
            transition: opacity 0.28s ease, transform 0.18s ease;
            z-index: 25;
            transform: translate3d(calc(var(--glow-x, 50vw) - 110px), calc(var(--glow-y, 50vh) - 110px), 0) scale(var(--glow-scale, 1));
        }
        #pointer-glow.is-pressed {
            --glow-scale: 0.88;
            opacity: 0.95;
        }
        body.is-pointer-active #pointer-glow {
            opacity: 1;
        }
        @keyframes backgroundPulse {
            0% {
                transform: scale(1) translate3d(0, 0, 0);
            }
            50% {
                transform: scale(1.05) translate3d(12px, -18px, 0);
            }
            100% {
                transform: scale(1.08) translate3d(-14px, 16px, 0);
            }
        }
        @keyframes auroraDrift {
            0% {
                transform: rotate(0deg) scale(1);
            }
            100% {
                transform: rotate(360deg) scale(1.05);
            }
        }
        @keyframes heroParallax {
            0% {
                transform: scale(1.12) translate3d(-2%, -1%, 0);
            }
            50% {
                transform: scale(1.16) translate3d(2%, 2%, 0);
            }
            100% {
                transform: scale(1.12) translate3d(-1%, 1%, 0);
            }
        }
        @keyframes floatOrbit {
            0% {
                transform: translate3d(0, 0, 0) scale(1);
            }
            50% {
                transform: translate3d(24px, -32px, 0) scale(1.05);
            }
            100% {
                transform: translate3d(-18px, 28px, 0) scale(0.98);
            }
        }
        @media (max-width: 768px) {
            header {
                padding: 2rem 1rem 1rem;
            }
            .nav-shell {
                flex-direction: column;
                align-items: stretch;
            }
            main {
                padding: 2rem 1rem 3rem;
            }
            .glass-panel {
                padding: 1.8rem;
            }
        }
    </style>
</head>
<body class="gradient-bg min-h-screen">
    <div class="ambient-lights">
        <span class="ambient ambient--one"></span>
        <span class="ambient ambient--two"></span>
        <span class="ambient ambient--three"></span>
    </div>
    <div class="relative z-10">
        <header>
            <div class="nav-shell max-w-6xl mx-auto">
                <div class="nav-group">
                    <a href="{{ url_for('dashboard') }}" class="nav-icon">
                        <i data-feather="arrow-right" class="w-5 h-5"></i>
                    </a>
                    <h1 class="nav-title">النظام الغذائي بالذكاء الاصطناعي</h1>
                </div>
            </div>
        </header>
        <main>
            <div class="max-w-5xl mx-auto">
                <div class="glass-panel">
                    <div class="glass-content space-y-8">
                        <h2 class="section-title">احصل على خطة غذائية مخصصة</h2>
                        <form action="{{ url_for('diet_view') }}" method="POST" class="space-y-6">
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                                <div>
                                    <label class="field-label">العمر</label>
                                    <input type="number" name="age" value="{{ request.form.get('age', '') }}" class="input-control" placeholder="25" required>
                                </div>
                                <div>
                                    <label class="field-label">الجنس</label>
                                    <select name="gender" class="input-control select-control">
                                        <option value="male" {% if request.form.get('gender', 'male') == 'male' %}selected{% endif %}>ذكر - رجل</option>
                                        <option value="female" {% if request.form.get('gender') == 'female' %}selected{% endif %}>أنثى - امرأة</option>
                                    </select>
                                </div>
                                <div>
                                    <label class="field-label">الطول (سم)</label>
                                    <input type="number" name="height" value="{{ request.form.get('height', '') }}" class="input-control" placeholder="170" required>
                                </div>
                                <div>
                                    <label class="field-label">الوزن (كجم)</label>
                                    <input type="number" name="weight" value="{{ request.form.get('weight', '') }}" class="input-control" placeholder="70" required>
                                </div>
                                <div>
                                    <label class="field-label">مستوى النشاط</label>
                                    <select name="activity" class="input-control select-control">
                                        <option value="sedentary" {% if request.form.get('activity') == 'sedentary' %}selected{% endif %}>خامل - بدون تمرين</option>
                                        <option value="light" {% if request.form.get('activity') == 'light' %}selected{% endif %}>نشاط خفيف - 1 إلى 3 أيام أسبوعيًا</option>
                                        <option value="moderate" {% if request.form.get('activity') == 'moderate' %}selected{% endif %}>نشاط متوسط - 3 إلى 5 أيام أسبوعيًا</option>
                                        <option value="active" {% if request.form.get('activity') == 'active' %}selected{% endif %}>نشاط عالي - 6 إلى 7 أيام أسبوعيًا</option>
                                    </select>
                                </div>
                                <div>
                                    <label class="field-label">الهدف</label>
                                    <select name="goal" class="input-control select-control">
                                        <option value="maintain" {% if request.form.get('goal') == 'maintain' %}selected{% endif %}>الحفاظ على الوزن الحالي</option>
                                        <option value="lose" {% if request.form.get('goal') == 'lose' %}selected{% endif %}>إنقاص الوزن (عجز سعري)</option>
                                        <option value="gain" {% if request.form.get('goal') == 'gain' %}selected{% endif %}>زيادة الوزن (فائض سعري)</option>
                                    </select>
                                </div>
                            </div>
                            <div>
                                <label class="field-label">الحساسية الغذائية أو الأطعمة الممنوعة</label>
                                <textarea name="allergies" class="input-control" rows="3" placeholder="اكتب أي حساسية أو أطعمة لا ترغب بها">{{ request.form.get('allergies', '') }}</textarea>
                            </div>
                            <button type="submit" class="action-button">إنشاء خطة غذائية</button>
                        </form>
                        {% if plan %}
                        <div class="plan-card">
                            <h3>خطتك الغذائية المقترحة</h3>
                            <div class="plan-body">
                                <div class="plan-text">{{ plan }}</div>
                            </div>
                        </div>
                        {% endif %}
                    </div>
                </div>
            </div>
        </main>
    </div>
    <script>
        const initPointerGlow = () => {
            if (document.getElementById('pointer-glow')) return;
            const glow = document.createElement('span');
            glow.id = 'pointer-glow';
            document.body.appendChild(glow);
            const setPosition = (x, y) => {
                glow.style.setProperty('--glow-x', `${x}px`);
                glow.style.setProperty('--glow-y', `${y}px`);
            };
            const activate = () => document.body.classList.add('is-pointer-active');
            const deactivate = () => document.body.classList.remove('is-pointer-active');
            window.addEventListener('pointermove', (event) => {
                activate();
                setPosition(event.clientX, event.clientY);
            }, { passive: true });
            window.addEventListener('pointerdown', () => glow.classList.add('is-pressed'));
            window.addEventListener('pointerup', () => glow.classList.remove('is-pressed'));
            window.addEventListener('pointerleave', deactivate);
            window.addEventListener('touchstart', (event) => {
                const primary = event.touches[0];
                if (!primary) return;
                activate();
                setPosition(primary.clientX, primary.clientY);
            }, { passive: true });
            window.addEventListener('touchmove', (event) => {
                const primary = event.touches[0];
                if (!primary) return;
                setPosition(primary.clientX, primary.clientY);
            }, { passive: true });
            window.addEventListener('touchend', deactivate, { passive: true });
        };
        document.addEventListener('DOMContentLoaded', () => {
            feather.replace();
            initPointerGlow();
        });
    </script>
</body>
</html>
